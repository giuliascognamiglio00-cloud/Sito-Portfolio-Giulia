<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instant Cam</title>
<style>
  /* Font del portfolio — percorsi relativi alla cartella "Sito Portfolio Giulia" */
  @font-face { font-family: "Anton"; src: url("font/Anton/Anton-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Google Sans Flex"; src: url("font/Google_Sans_Flex/static/GoogleSansFlex_24pt-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Google Sans Flex"; src: url("font/Google_Sans_Flex/static/GoogleSansFlex_24pt-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }

  /* Layout: oggetto al centro su fondo chiaro, didascalia sotto con filetto */
  :root {
    --bg: #f2f2f1;
    --ink: #0e0e0f;
    --muted: #77777a;
    --line: #d4d4d3;
    --accent: #d6342a;
    color-scheme: light;
  }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: "Google Sans Flex", "Google Sans", system-ui, sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; box-sizing: border-box; }

  /* ===== Blocco da copiare nel sito: il div .instant-cam + lo script ===== */
  .instant-cam { width: 100%; max-width: 600px; margin: 0 auto; }
  .instant-cam .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; }
  .instant-cam canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; outline: none; }
  .instant-cam canvas.is-dragging { cursor: grabbing; }
  .instant-cam canvas.is-shutter { cursor: pointer; }
  .instant-cam canvas:focus-visible { outline: 1px dashed var(--muted); outline-offset: -8px; }
  .instant-cam .hint {
    position: absolute; top: 3%; width: 100%; text-align: center; pointer-events: none; transition: opacity .6s;
    font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .instant-cam .caption {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;
    border-top: 1px solid var(--line); padding-top: 14px;
  }
  .instant-cam .overline { margin: 0 0 4px; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .instant-cam .title { margin: 0; font-family: "Anton", Impact, "Arial Narrow", sans-serif; font-weight: 400; font-size: clamp(28px, 7vw, 40px); line-height: .95; letter-spacing: .01em; text-transform: uppercase; }
  .instant-cam .controls { display: flex; align-items: center; gap: 18px; padding-bottom: 4px; }
  .instant-cam .swatches { display: flex; gap: 10px; }
  .instant-cam .swatches button {
    width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--bg); padding: 0; cursor: pointer;
    box-shadow: 0 0 0 1px var(--line); transition: transform .2s, box-shadow .2s;
  }
  .instant-cam .swatches button[aria-pressed="true"] { transform: scale(1.2); box-shadow: 0 0 0 1.5px var(--ink); }
  .instant-cam .shoot {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 8px 10px; border-radius: 999px;
    border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer;
    font: 500 12px/1 "Google Sans Flex", system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase;
    transition: background .2s, color .2s;
  }
  .instant-cam .shoot::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .instant-cam .shoot:hover { background: var(--ink); color: var(--bg); }
  .instant-cam .shoot:disabled { opacity: .45; cursor: default; background: transparent; color: var(--ink); }
  .instant-cam .sound { border: 0; background: none; padding: 6px 2px; cursor: pointer; color: var(--muted); font: 500 11px/1 "Google Sans Flex", system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  .instant-cam .sound:hover { color: var(--ink); }
  .instant-cam button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>

<div class="instant-cam" id="instantCam">
  <div class="stage">
    <div class="hint">Trascina per ruotare · clicca i tasti</div>
  </div>
  <div class="caption">
    <div>
      <p class="overline">Oggetto 02 — Fotografia istantanea</p>
      <h2 class="title">Instant Cam</h2>
    </div>
    <div class="controls">
      <div class="swatches" role="group" aria-label="Tonalità">
        <button data-p="nero" style="background:#121213" aria-label="Nero" title="Nero" aria-pressed="true"></button>
        <button data-p="antracite" style="background:#2c2c2e" aria-label="Antracite" title="Antracite" aria-pressed="false"></button>
        <button data-p="grafite" style="background:#55555a" aria-label="Grafite" title="Grafite" aria-pressed="false"></button>
        <button data-p="cenere" style="background:#9a9a9e" aria-label="Cenere" title="Cenere" aria-pressed="false"></button>
      </div>
      <button class="sound" id="soundBtn" type="button" aria-pressed="true">Suono sì</button>
      <button class="shoot" id="shootBtn" type="button">Scatta</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const host = document.getElementById('instantCam');
  const stage = host.querySelector('.stage');
  const hint = host.querySelector('.hint');
  const shootBtn = document.getElementById('shootBtn');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  Promise.all([fontsReady, document.fonts ? document.fonts.load('40px "Anton"').catch(() => {}) : 0]).then(init);

  function init() {
  // =====================================================================
  // Renderer / scena / luci
  // =====================================================================
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.setAttribute('tabindex', '0');
  renderer.domElement.setAttribute('aria-label', 'Modello 3D di una fotocamera istantanea con sticker. Trascina per ruotare, clicca i tasti, Invio per scattare, O per accendere o spegnere.');
  stage.prepend(renderer.domElement);
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
  const target = new THREE.Vector3(0, 0.1, 0.4);

  (function makeEnv() {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = new THREE.Scene();
    env.background = new THREE.Color(0x1c1c1c);
    const panel = (w, h, pos, rot, k) => {
      const mat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }); mat.color.setScalar(k);
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(...pos); m.rotation.set(...rot); env.add(m);
    };
    panel(7, 4, [0, 7, 1], [Math.PI / 2, 0, 0], 3.0);
    panel(2.2, 7, [-7, 2, 3], [0, Math.PI / 2, 0], 2.0);
    panel(1.6, 7, [7, 2, -1], [0, -Math.PI / 2, 0], 1.5);
    panel(6, 2.5, [0, 1.5, 8], [0, Math.PI, 0], 0.8);
    panel(6, 2.5, [0, 2, -8], [0, 0, 0], 0.9);
    panel(20, 20, [0, -4, 0], [-Math.PI / 2, 0, 0], 0.25);
    scene.environment = pmrem.fromScene(env, 0.02).texture;
    pmrem.dispose();
  })();

  const key = new THREE.DirectionalLight(0xffffff, 1.45);
  key.position.set(-4.5, 9, 6);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 4;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.85); rim.position.set(5, 4, -6); scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3a3a, 0.28));

  // =====================================================================
  // Texture procedurali
  // =====================================================================
  function normalMapFromHeight(w, h, heightFn, strength, rx = 1, ry = 1) {
    const H = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) H[y * w + x] = heightFn(x / w, y / h);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const l = H[y * w + (x - 1 + w) % w], r = H[y * w + (x + 1) % w];
      const u = H[((y - 1 + h) % h) * w + x], d = H[((y + 1) % h) * w + x];
      let nx = (l - r) * strength, ny = (d - u) * strength, nz = 1;
      const len = Math.hypot(nx, ny, nz);
      const i = (y * w + x) * 4;
      img.data[i] = (nx / len * 0.5 + 0.5) * 255; img.data[i + 1] = (ny / len * 0.5 + 0.5) * 255;
      img.data[i + 2] = (nz / len * 0.5 + 0.5) * 255; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = maxAniso;
    return t;
  }
  // plastica opaca leggermente goffrata (come il guscio della fotocamera)
  const blur = (() => { const N = 128, a = new Float32Array(N * N); for (let i = 0; i < a.length; i++) a[i] = Math.random();
    return (u, v) => { const x = Math.floor(u * N), y = Math.floor(v * N); let s = 0;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) s += a[((y + j + N) % N) * N + (x + i + N) % N]; return s / 9; }; })();
  const plasticN = normalMapFromHeight(256, 256, blur, 3, 3, 3);
  const ribsN = normalMapFromHeight(64, 64, (u, v) => Math.abs(Math.sin(v * Math.PI * 6)), 4, 1, 1);
  const ribsFlash = normalMapFromHeight(64, 64, (u) => Math.abs(Math.sin(u * Math.PI * 10)), 5, 1, 1);

  // =====================================================================
  // Materiali
  // =====================================================================
  const plastic = (color, rough = 0.58, ns = 0.4) => new THREE.MeshPhysicalMaterial({
    color, roughness: rough, metalness: 0, clearcoat: 0.08, clearcoatRoughness: 0.55,
    normalMap: plasticN, normalScale: new THREE.Vector2(ns, ns)
  });
  const M = {
    body:   plastic(0x141415, 0.6, 0.45),
    trim:   plastic(0x1a1a1c, 0.5, 0.3),
    soft:   plastic(0x202022, 0.85, 0.7),
    gloss:  new THREE.MeshPhysicalMaterial({ color: 0x0e0e0f, roughness: 0.22, clearcoat: 0.7, clearcoatRoughness: 0.15 }),
    black:  new THREE.MeshStandardMaterial({ color: 0x030303, roughness: 0.95, side: THREE.DoubleSide }),
    red:    new THREE.MeshPhysicalMaterial({ color: 0xd8301f, roughness: 0.32, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
    redRib: new THREE.MeshPhysicalMaterial({ color: 0xd8301f, roughness: 0.42, clearcoat: 0.3, normalMap: ribsN }),
    glass:  new THREE.MeshPhysicalMaterial({ color: 0x06100c, roughness: 0.02, clearcoat: 1, clearcoatRoughness: 0.01, envMapIntensity: 3.2 }),
    coatG:  new THREE.MeshStandardMaterial({ color: 0x22604a, roughness: 0.06, metalness: 1, envMapIntensity: 1.4 }),
    coatP:  new THREE.MeshStandardMaterial({ color: 0x3a2a4a, roughness: 0.08, metalness: 1, envMapIntensity: 1.1 }),
    clear:  new THREE.MeshPhysicalMaterial({ color: 0xa4aaae, roughness: 0.06, metalness: 0.15, clearcoat: 1, envMapIntensity: 2.4 }),
    metal:  new THREE.MeshStandardMaterial({ color: 0xc9c9cb, roughness: 0.16, metalness: 1 }),
    metalR: new THREE.MeshStandardMaterial({ color: 0xd8d8da, roughness: 0.22, metalness: 1, normalMap: ribsFlash }),
    paper:  new THREE.MeshStandardMaterial({ color: 0xf7f6f2, roughness: 0.85 }),
    grey:   new THREE.MeshStandardMaterial({ color: 0x8a8a8c, roughness: 0.5 }),
    hole:   new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.6, emissive: 0xffc77a, emissiveIntensity: 0 })
  };
  const PALETTES = {
    nero:      { body: 0x141415, trim: 0x1a1a1c, soft: 0x202022 },
    antracite: { body: 0x2e2e31, trim: 0x353538, soft: 0x3a3a3d },
    grafite:   { body: 0x55555a, trim: 0x5e5e63, soft: 0x4a4a4e },
    cenere:    { body: 0x9c9ca0, trim: 0xa6a6aa, soft: 0x7c7c80 }
  };

  // =====================================================================
  // Utilità geometriche
  // =====================================================================
  function roundedRectShape(w, h, r) {
    const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  function slab(shape, depth, bevel, seg = 5) {
    const g = new THREE.ExtrudeGeometry(shape, { depth: Math.max(0.001, depth - 2 * bevel), bevelEnabled: true,
      bevelThickness: bevel, bevelSize: bevel, bevelSegments: seg, curveSegments: 18 });
    g.translate(0, 0, -(depth - 2 * bevel) / 2); g.computeVertexNormals(); return g;
  }
  // box(w,h,d, raggio angoli in vista frontale, smusso)
  function box(w, h, d, r, bevel, seg) { return slab(roundedRectShape(w - 2 * bevel, h - 2 * bevel, Math.max(0.01, r - bevel)), d, bevel, seg); }
  function cylZ(r, len, seg = 72, open = false) { const g = new THREE.CylinderGeometry(r, r, len, seg, 1, open); g.rotateX(Math.PI / 2); return g; }
  function lathe(pts, seg = 120) { const g = new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg); g.rotateX(Math.PI / 2); return g; }
  function canvasTex(c) { const t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso; t.encoding = THREE.sRGBEncoding; return t; }
  function textPlane(text, w, h, px, color = '#d9d9d9', weight = 500, family = '"Google Sans Flex", Arial, sans-serif') {
    const c = document.createElement('canvas'); c.width = Math.round(w * 400); c.height = Math.round(h * 400);
    const g = c.getContext('2d'); g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `${weight} ${px}px ${family}`; g.fillText(text, c.width / 2, c.height / 2);
    return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: canvasTex(c), transparent: true, roughness: 0.6, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 }));
  }

  // =====================================================================
  // Modello (unità ≈ 2.8 cm; +Z = frontale con obiettivo; +X = lato mirino)
  // =====================================================================
  const model = new THREE.Group();
  const add = (geo, mat, x = 0, y = 0, z = 0, parent = model) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
  };
  // Oggetti cliccabili: ogni gruppo con userData.onClick
  const clickables = [];
  function clickable(obj, fn) { obj.userData.onClick = fn; clickables.push(obj); return obj; }
  // Animazione di pressione: spinge il gruppo lungo una direzione e lo fa tornare
  const presses = [];
  function pressAnim(obj, dir, depth) { presses.push({ obj, base: obj.position.clone(), dir: dir.clone(), depth, t: 0, active: true }); }
  function updatePresses(dt) {
    presses.forEach(p => {
      if (!p.active) return;
      p.t += dt; const t = p.t;
      const k = t < 0.08 ? t / 0.08 : Math.max(0, 1 - (t - 0.08) / 0.18);
      p.obj.position.copy(p.base).addScaledVector(p.dir, -p.depth * k);
      if (t > 0.3) { p.active = false; p.obj.position.copy(p.base); }
    });
  }
  function press(obj, dir, depth) {
    const ex = presses.find(p => p.obj === obj);
    if (ex) { ex.t = 0; ex.active = true; } else pressAnim(obj, dir, depth);
  }
  const FWD = new THREE.Vector3(0, 0, 1), BWD = new THREE.Vector3(0, 0, -1);

  const W = 4.0;
  const BASE_H = 1.0, BASE_FRONT = 2.3, BASE_BACK = -2.3;
  const HEAD_FRONT = 1.6, HEAD_BACK = 0.75, HEAD_TOP = 3.55;
  const SLOT_Y = 0.62;

  // --- Base porta-pellicola (sporge in avanti fin sotto l'obiettivo)
  add(box(W, BASE_H, BASE_FRONT - BASE_BACK, 0.14, 0.09, 6), M.body, 0, BASE_H / 2, (BASE_FRONT + BASE_BACK) / 2);
  // Fessura di uscita della foto, incassata, con labbro superiore
  add(box(3.56, 0.12, 0.08, 0.04, 0.015, 2), M.black, 0, SLOT_Y, BASE_FRONT - 0.02);
  add(box(3.7, 0.08, 0.1, 0.03, 0.02, 2), M.trim, 0, SLOT_Y + 0.1, BASE_FRONT + 0.015);
  add(box(3.7, 0.05, 0.06, 0.02, 0.01, 1), M.trim, 0, SLOT_Y - 0.09, BASE_FRONT + 0.0);
  // pannello frontale inferiore incassato con filetto
  add(box(3.76, 0.36, 0.03, 0.06, 0.012, 2), M.gloss, 0, 0.27, BASE_FRONT + 0.002);
  // giunzioni sui fianchi: orizzontale sul retro e diagonale dello sportello pellicola
  [-1, 1].forEach(sx => {
    const xx = sx * (W / 2 + 0.003);
    add(new THREE.BoxGeometry(0.02, 0.022, 2.15), M.black, xx, 0.42, -1.22);
    const dg = add(new THREE.BoxGeometry(0.02, 1.05, 0.022), M.black, xx, 0.5, -0.02); dg.rotation.x = 0.29;
  });
  // ganci posteriori dello sportello
  [-1.35, 1.35].forEach(x => {
    add(box(0.6, 0.24, 0.12, 0.05, 0.03, 3), M.trim, x, 0.3, BASE_BACK - 0.03);
    add(box(0.44, 0.05, 0.14, 0.02, 0.01, 1), M.trim, x, 0.44, BASE_BACK - 0.06);
  });
  // fondo: piedini, viti e attacco treppiede con anelli concentrici
  [[-1.65, 1.9], [1.65, 1.9], [-1.65, -1.95], [1.65, -1.95]].forEach(([x, z]) => add(new THREE.CylinderGeometry(0.09, 0.1, 0.03, 24), M.soft, x, -0.01, z));
  [[-1.2, 0.9], [1.2, 0.9], [-1.2, -1.2], [1.2, -1.2]].forEach(([x, z]) => add(new THREE.CylinderGeometry(0.035, 0.035, 0.01, 16), M.metal, x, -0.002, z));
  [0.32, 0.24, 0.16].forEach((r, i) => add(new THREE.CylinderGeometry(r, r, 0.01 + i * 0.004, 48), i % 2 ? M.trim : M.body, 0, -0.004 - i * 0.002, -0.3));
  add(new THREE.CylinderGeometry(0.05, 0.05, 0.03, 20), M.black, 0, -0.012, -0.3);

  // --- Blocco frontale inferiore (meccanica di espulsione), a filo con la base
  add(box(W, 0.56, BASE_FRONT - HEAD_FRONT + 0.15, 0.1, 0.07, 5), M.trim, 0, BASE_H + 0.27, (BASE_FRONT + HEAD_FRONT - 0.15) / 2);
  add(new THREE.BoxGeometry(W - 0.1, 0.02, 0.02), M.black, 0, BASE_H + 0.005, BASE_FRONT - 0.004);
  // incavo centrale con cursore
  add(box(1.5, 0.28, 0.1, 0.12, 0.03, 3), M.black, 0.3, BASE_H + 0.28, BASE_FRONT - 0.02);
  const ejector = new THREE.Group(); ejector.position.set(0.66, BASE_H + 0.28, BASE_FRONT + 0.02); model.add(ejector);
  add(box(0.34, 0.22, 0.12, 0.1, 0.045, 4), M.trim, 0, 0, 0, ejector);
  // scanalature laterali del blocco
  [-1.32, 1.32].forEach(x => add(box(0.025, 0.46, 0.02, 0.01, 0.005, 1), M.black, x, BASE_H + 0.27, BASE_FRONT + 0.0));

  // --- Frontale verticale
  add(box(W, HEAD_TOP - BASE_H, HEAD_FRONT - HEAD_BACK, 0.34, 0.11, 6), M.body, 0, (HEAD_TOP + BASE_H) / 2, (HEAD_FRONT + HEAD_BACK) / 2);

  // Obiettivo: corpo cilindrico sporgente, anelli concentrici a imbuto, lenti
  const LX = 0.12, LY = 2.5;
  (function lens() {
    const g = new THREE.Group(); g.position.set(LX, LY, HEAD_FRONT); model.add(g);
    const a = (geo, mat, z = 0) => add(geo, mat, 0, 0, z, g);
    // base di raccordo con il frontale
    a(lathe([[1.0, 0.0], [0.97, 0.03], [0.95, 0.06]]), M.body);
    // fusto sporgente con spigolo frontale arrotondato
    a(lathe([[0.95, 0.06], [0.955, 0.12], [0.955, 0.48], [0.95, 0.52], [0.93, 0.56], [0.9, 0.58], [0.86, 0.585]]), M.body);
    // anelli concentrici che scendono verso la lente
    const pts = []; let r = 0.86, z = 0.585;
    for (let i = 0; i < 10; i++) { pts.push([r, z]); r -= 0.02; z -= 0.004; pts.push([r, z + 0.012]); r -= 0.014; z -= 0.012; }
    pts.push([r, z]); pts.push([r - 0.02, z - 0.03]); pts.push([0.44, z - 0.05]);
    a(lathe(pts, 140), M.trim);
    const zIn = z - 0.05;
    a(cylZ(0.44, 0.35, 64, true), M.black, zIn - 0.17);
    // lenti interne e frontale con trattamento (riflesso verde)

      shot.out = e * (PR_L - 0.35);
      print.position.z = shot.out - PR_L;
      printPivot.rotation.x = 0.1 * e * e;
      if (k >= 1) { shot.state = 'out'; shot.busy = false; shootBtn.disabled = false; }
    }
  }
  const DEV_FROM = new THREE.Color(0x3a403b), DEV_TO = new THREE.Color(0xffffff);
  function updateDevelop(dt) {
    if (shot.state !== 'ejecting' && shot.state !== 'out') return;
    shot.dev = Math.min(1, shot.dev + dt / 7);
    const d = shot.dev, ease = d * d * (3 - 2 * d);
    photoMat.color.copy(DEV_FROM).lerp(DEV_TO, ease);
  }

  // Cursori: scorrono morbidamente verso la posizione scelta
  function updateSliders(dt) {
    const k = 1 - Math.exp(-dt * 14);
    topSlider.position.x += (topSlider.userData.tx - topSlider.position.x) * k;
    expo.position.x += (expo.userData.tx - expo.position.x) * k;
    power.position.y += (power.userData.ty - power.position.y) * k;
    // luce dei fori: accensione con breve sfarfallio
    const target = isOn ? 1 : 0;
    glow += (target - glow) * (1 - Math.exp(-dt * (isOn ? 6 : 10)));
    const flick = isOn && glow < 0.95 ? (Math.random() * 0.4 + 0.6) : 1;
    M.hole.emissiveIntensity = 2.2 * glow * flick;
    holeLight.intensity = 0.6 * glow * flick;
    led.material.emissiveIntensity = shot.busy && isOn ? 1.5 : 0;
  }

  // =====================================================================
  // Interazione
  // =====================================================================
  let yaw = 0.55, tYaw = yaw, elev = 0.3, tElev = elev;
  let dragging = false, moved = 0, lastX = 0, lastY = 0, idle = 0, vel = 0;
  const el = renderer.domElement;
  const ELEV_MIN = 0.04, ELEV_MAX = 1.05;
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(e) {
    const r = el.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, cam);
    const hits = ray.intersectObjects(model.children, true);
    if (!hits.length) return null;
    let o = hits[0].object; while (o) { if (o.userData.onClick) return o; o = o.parent; } return null;
  }
  el.addEventListener('pointerdown', e => { dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; el.setPointerCapture(e.pointerId); el.classList.add('is-dragging'); });
  el.addEventListener('pointermove', e => {
    if (!dragging) { el.classList.toggle('is-shutter', !!pick(e)); return; }
    const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 4) { hint.style.opacity = 0; vel = dx * 0.01; tYaw += vel; tElev = Math.max(ELEV_MIN, Math.min(ELEV_MAX, tElev + dy * 0.005)); idle = 0; }
  });
  el.addEventListener('pointerup', e => {
    dragging = false; el.classList.remove('is-dragging');
    if (moved <= 4) { const o = pick(e); if (o) { o.userData.onClick(); idle = 0; } }
  });
  el.addEventListener('pointercancel', () => { dragging = false; el.classList.remove('is-dragging'); });
  el.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') tYaw -= 0.3;
    if (e.key === 'ArrowRight') tYaw += 0.3;
    if (e.key === 'ArrowUp') tElev = Math.min(ELEV_MAX, tElev + 0.12);
    if (e.key === 'ArrowDown') tElev = Math.max(ELEV_MIN, tElev - 0.12);
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!isOn) setPower(true); shoot(); }
    if (e.key === 'o' || e.key === 'O') setPower(!isOn);
    idle = 0;
  });

  // =====================================================================
  // Resize + loop
  // =====================================================================
  const DIST = 18;
  function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(stage); resize();

  let visible = true, t0 = performance.now(), running = false;
  new IntersectionObserver(([en]) => { visible = en.isIntersecting; if (visible && !running) { t0 = performance.now(); requestAnimationFrame(loop); } }).observe(stage);

  function loop(now) {
    if (!visible) { running = false; return; }
    running = true;
    const dt = Math.min(0.05, (now - t0) / 1000); t0 = now; idle += dt;
    if (!dragging) { tYaw += vel; vel *= 0.92; if (!reduceMotion && idle > 3 && !shot.busy) tYaw += dt * 0.25; }
    yaw += (tYaw - yaw) * 0.12; elev += (tElev - elev) * 0.12;
    pivot.rotation.y = yaw;
    const bob = reduceMotion ? 0 : Math.sin(now / 1100) * 0.09;
    pivot.position.y = 0.24 + bob;
    const k = (bob + 0.09) / 0.18; contact.scale.setScalar(1 + k * 0.12); contact.material.opacity = 0.75 - k * 0.25;
    updatePresses(dt); updateSliders(dt); updateShot(dt); updateDevelop(dt);
    cam.position.set(0, target.y + Math.sin(elev) * DIST, Math.cos(elev) * DIST); cam.lookAt(target);
    renderer.render(scene, cam);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
