<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Cam</title>
<style>
  /* Font del portfolio — percorsi relativi alla cartella "Sito Portfolio Giulia" */
  @font-face { font-family: "Anton"; src: url("font/Anton/Anton-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Google Sans Flex"; src: url("font/Google_Sans_Flex/static/GoogleSansFlex_24pt-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Google Sans Flex"; src: url("font/Google_Sans_Flex/static/GoogleSansFlex_24pt-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }

  /* Layout: oggetto al centro su fondo chiaro, didascalia sotto con filetto */
  :root {
    --bg: #f2f2f1;
    --ink: #0e0e0f;
    --muted: #77777a;
    --line: #d4d4d3;
    color-scheme: light;
  }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: "Google Sans Flex", "Google Sans", system-ui, sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; box-sizing: border-box; }

  /* ===== Blocco da copiare nel sito: il div .mini-cam + lo script ===== */
  .mini-cam { width: 100%; max-width: 560px; margin: 0 auto; }
  .mini-cam .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 0.92; }
  .mini-cam canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; outline: none; }
  .mini-cam canvas:active { cursor: grabbing; }
  .mini-cam canvas:focus-visible { outline: 1px dashed var(--muted); outline-offset: -8px; }
  .mini-cam .hint {
    position: absolute; top: 3%; width: 100%; text-align: center; pointer-events: none; transition: opacity .6s;
    font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .mini-cam .caption {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;
    border-top: 1px solid var(--line); padding-top: 14px;
  }
  .mini-cam .overline { margin: 0 0 4px; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .mini-cam .title { margin: 0; font-family: "Anton", Impact, "Arial Narrow", sans-serif; font-weight: 400; font-size: clamp(28px, 7vw, 40px); line-height: .95; letter-spacing: .01em; text-transform: uppercase; }
  .mini-cam .swatches { display: flex; gap: 10px; padding-bottom: 6px; }
  .mini-cam .swatches button {
    width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--bg); padding: 0; cursor: pointer;
    box-shadow: 0 0 0 1px var(--line); transition: transform .2s, box-shadow .2s;
  }
  .mini-cam .swatches button[aria-pressed="true"] { transform: scale(1.2); box-shadow: 0 0 0 1.5px var(--ink); }
  .mini-cam .swatches button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>

<div class="mini-cam" id="miniCam">
  <div class="stage">
    <div class="hint">Trascina per ruotare</div>
  </div>
  <div class="caption">
    <div>
      <p class="overline">Oggetto 01 — Fotografia</p>
      <h2 class="title">Mini Cam</h2>
    </div>
    <div class="swatches" role="group" aria-label="Tonalità">
      <button data-p="nero" style="background:#0e0e0f" aria-label="Nero" title="Nero" aria-pressed="true"></button>
      <button data-p="antracite" style="background:#2c2c2e" aria-label="Antracite" title="Antracite" aria-pressed="false"></button>
      <button data-p="grafite" style="background:#55555a" aria-label="Grafite" title="Grafite" aria-pressed="false"></button>
      <button data-p="cenere" style="background:#9a9a9e" aria-label="Cenere" title="Cenere" aria-pressed="false"></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const host = document.getElementById('miniCam');
  const stage = host.querySelector('.stage');
  const hint = host.querySelector('.hint');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  fontsReady.then(init);

  function init() {
  // =====================================================================
  // Renderer / scena
  // =====================================================================
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.setAttribute('tabindex', '0');
  renderer.domElement.setAttribute('aria-label', 'Modello 3D di una fotocamera mirrorless, trascinabile');
  stage.prepend(renderer.domElement);
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
  const target = new THREE.Vector3(0, -0.05, 0);

  // ---------- Ambiente da studio (softbox) per riflessi credibili ----------
  (function makeEnv() {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = new THREE.Scene();
    env.background = new THREE.Color(0x1c1c1c);
    const panel = (w, h, pos, rot, k) => {
      const mat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
      mat.color.setScalar(k);
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      m.position.set(...pos); m.rotation.set(...rot); env.add(m);
    };
    panel(7, 4, [0, 7, 1], [Math.PI / 2, 0, 0], 3.2);          // softbox dall'alto
    panel(2.2, 7, [-7, 2, 3], [0, Math.PI / 2, 0], 2.2);       // strip sinistra
    panel(1.6, 7, [7, 2, -1], [0, -Math.PI / 2, 0], 1.6);      // strip destra
    panel(6, 2.5, [0, 1.5, 8], [0, Math.PI, 0], 0.7);          // fill frontale
    panel(5, 2, [0, 2, -8], [0, 0, 0], 0.9);                   // controluce
    panel(20, 20, [0, -4, 0], [-Math.PI / 2, 0, 0], 0.22);     // pavimento chiaro
    scene.environment = pmrem.fromScene(env, 0.02).texture;
    pmrem.dispose();
  })();

  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(-4.5, 9, 5.5);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -5; key.shadow.camera.right = 5;
  key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
  key.shadow.camera.near = 1; key.shadow.camera.far = 25;
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
  key.shadow.radius = 4;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.9);
  rim.position.set(5, 4, -6);
  scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3a3a, 0.25));

  // =====================================================================
  // Texture procedurali (mappe normali)
  // =====================================================================
  function normalMapFromHeight(size, heightFn, strength, repeatX = 1, repeatY = 1) {
    const w = size[0], h = size[1];
    const H = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) H[y * w + x] = heightFn(x / w, y / h);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const l = H[y * w + (x - 1 + w) % w], r = H[y * w + (x + 1) % w];
      const u = H[((y - 1 + h) % h) * w + x], d = H[((y + 1) % h) * w + x];
      let nx = (l - r) * strength, ny = (d - u) * strength, nz = 1;
      const len = Math.hypot(nx, ny, nz); nx /= len; ny /= len; nz /= len;
      const i = (y * w + x) * 4;
      img.data[i] = (nx * 0.5 + 0.5) * 255; img.data[i + 1] = (ny * 0.5 + 0.5) * 255;
      img.data[i + 2] = (nz * 0.5 + 0.5) * 255; img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeatX, repeatY);
    t.anisotropy = maxAniso;
    return t;
  }

  // Similpelle: celle di Voronoi (grana "a sassolini")
  function leatherHeight() {
    const N = 40, pts = [];
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) pts.push([(i + 0.15 + rnd() * 0.7) / N, (j + 0.15 + rnd() * 0.7) / N]);
    return (u, v) => {
      const ci = Math.floor(u * N), cj = Math.floor(v * N);
      let f1 = 9, f2 = 9;
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        const ii = (ci + di + N) % N, jj = (cj + dj + N) % N;
        const p = pts[jj * N + ii];
        let px = p[0] + (ci + di < 0 ? -1 : ci + di >= N ? 1 : 0);
        let py = p[1] + (cj + dj < 0 ? -1 : cj + dj >= N ? 1 : 0);
        const d = Math.hypot(u - px, v - py);
        if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
      }
      const e = Math.min(1, (f2 - f1) * N * 2.2);
      return Math.sqrt(e) * 0.9 + (rnd() - 0.5) * 0.04;
    };
  }
  const leatherN = normalMapFromHeight([512, 512], leatherHeight(), 5, 0.55, 0.55);

  // Zigrinatura a diamante (ghiera zoom in gomma)
  const knurlN = normalMapFromHeight([512, 64], (u, v) => {
    const a = (u * 8 + v) % 1, b = (u * 8 - v + 10) % 1;
    return Math.min(Math.abs(a - 0.5), Math.abs(b - 0.5)) * 2;
  }, 14, 9, 7);

  // Righe verticali (ghiere, rotelle)
  const ribsN = (count) => normalMapFromHeight([256, 8], (u) => Math.abs(Math.sin(u * Math.PI)), 6, count, 1);
  const focusRibsN = ribsN(110);
  const dialRibsN = ribsN(48);
  const smallDialRibsN = ribsN(36);

  // Plastica opaca: microgranulosità
  const plasticN = normalMapFromHeight([256, 256], () => Math.random(), 0.6, 4, 4);

  // =====================================================================
  // Materiali
  // =====================================================================
  const M = {
    body:    new THREE.MeshStandardMaterial({ color: 0x18181a, roughness: 0.48, metalness: 0.0, normalMap: plasticN, normalScale: new THREE.Vector2(0.35, 0.35) }),
    leather: new THREE.MeshStandardMaterial({ color: 0x0f0f10, roughness: 0.72, normalMap: leatherN, normalScale: new THREE.Vector2(0.9, 0.9) }),
    lens:    new THREE.MeshStandardMaterial({ color: 0x121213, roughness: 0.5, normalMap: plasticN, normalScale: new THREE.Vector2(0.25, 0.25) }),
    knurl:   new THREE.MeshStandardMaterial({ color: 0x0c0c0d, roughness: 0.82, normalMap: knurlN, normalScale: new THREE.Vector2(1, 1) }),
    focus:   new THREE.MeshStandardMaterial({ color: 0x0f0f10, roughness: 0.65, normalMap: focusRibsN }),
    dial:    new THREE.MeshStandardMaterial({ color: 0x141415, roughness: 0.45, metalness: 0.2, normalMap: dialRibsN }),
    dialS:   new THREE.MeshStandardMaterial({ color: 0x141415, roughness: 0.45, metalness: 0.2, normalMap: smallDialRibsN }),
    button:  new THREE.MeshStandardMaterial({ color: 0x151516, roughness: 0.38 }),
    metal:   new THREE.MeshStandardMaterial({ color: 0xc4c4c6, roughness: 0.18, metalness: 1 }),
    metalD:  new THREE.MeshStandardMaterial({ color: 0x5a5a5d, roughness: 0.3, metalness: 1 }),
    glass:   new THREE.MeshPhysicalMaterial({ color: 0x050506, roughness: 0.02, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.01, reflectivity: 1, envMapIntensity: 3 }),
    coatA:   new THREE.MeshStandardMaterial({ color: 0x1d2b22, roughness: 0.06, metalness: 1, envMapIntensity: 1.4 }),
    coatB:   new THREE.MeshStandardMaterial({ color: 0x2a1d2c, roughness: 0.08, metalness: 1, envMapIntensity: 1.2 }),
    black:   new THREE.MeshStandardMaterial({ color: 0x030303, roughness: 0.95, side: THREE.DoubleSide }),
    screen:  new THREE.MeshPhysicalMaterial({ color: 0x070708, roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.6 }),
    lamp:    new THREE.MeshPhysicalMaterial({ color: 0xdedede, roughness: 0.1, clearcoat: 1, transparent: true, opacity: 0.9 }),
    white:   new THREE.MeshStandardMaterial({ color: 0xeaeaea, roughness: 0.4 })
  };
  // Tutti i materiali "di colore" che cambiano con la palette
  const PALETTES = {
    nero:      { body: 0x18181a, leather: 0x0f0f10, lens: 0x121213, trim: 0x0c0c0d },
    antracite: { body: 0x303033, leather: 0x1f1f21, lens: 0x18181a, trim: 0x101011 },
    grafite:   { body: 0x58585c, leather: 0x38383b, lens: 0x1c1c1e, trim: 0x131314 },
    cenere:    { body: 0x9e9ea2, leather: 0x66666a, lens: 0x202022, trim: 0x161617 }
  };

  // =====================================================================
  // Utilità geometriche
  // =====================================================================
  function roundedRectShape(w, h, r) {
    const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  // Blocco smussato: estrusione lungo Z, centrato
  function slab(shape, depth, bevel, seg = 5) {
    const g = new THREE.ExtrudeGeometry(shape, {
      depth: Math.max(0.001, depth - 2 * bevel), bevelEnabled: true,
      bevelThickness: bevel, bevelSize: bevel, bevelSegments: seg, curveSegments: 18
    });
    g.translate(0, 0, -(depth - 2 * bevel) / 2);
    g.computeVertexNormals();
    return g;
  }
  function box(w, h, d, r, bevel, seg) { return slab(roundedRectShape(w - 2 * bevel, h - 2 * bevel, Math.max(0.01, r - bevel)), d, bevel, seg); }
  function cylZ(r, len, seg = 72, open = false) { const g = new THREE.CylinderGeometry(r, r, len, seg, 1, open); g.rotateX(Math.PI / 2); return g; }
  function lathe(pts, seg = 96) { const g = new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg); g.rotateX(Math.PI / 2); return g; }

  // Etichette incise (testo su piano trasparente)
  function textTexture(lines, w, h, px, weight = 500, align = 'center') {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.textAlign = align; x.textBaseline = 'middle';
    x.font = `${weight} ${px}px "Google Sans Flex", "Google Sans", Arial, sans-serif`;
    lines.forEach((t, i) => x.fillText(t, align === 'center' ? w / 2 : 4, h / (lines.length + 1) * (i + 1)));
    const t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso; t.encoding = THREE.sRGBEncoding;
    return t;
  }
  const labelMat = (tex, op = 0.85) => new THREE.MeshStandardMaterial({
    map: tex, color: 0xd9d9d9, roughness: 0.6, transparent: true, opacity: op, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -4
  });
  function label(text, w, h, parent, pos, rotY = 0, px = 64) {
    const tex = textTexture([text], Math.round(w * 400), Math.round(h * 400), px);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), labelMat(tex));
    m.position.set(...pos); m.rotation.y = rotY; parent.add(m); return m;
  }

  // =====================================================================
  // Modello  (unità ≈ 3 cm; +Z = frontale, impugnatura a X negativa)
  // =====================================================================
  const model = new THREE.Group();
  const add = (geo, mat, x = 0, y = 0, z = 0, parent = model) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
  };

  const BODY_W = 4.1, BODY_H = 2.1, BODY_D = 1.2, BODY_Y = -0.1;
  const FRONT = BODY_D / 2, BACK = -BODY_D / 2, TOP = BODY_Y + BODY_H / 2, BOTTOM = BODY_Y - BODY_H / 2;

  // Corpo principale
  add(box(BODY_W, BODY_H, BODY_D, 0.32, 0.14), M.body, 0, BODY_Y, 0);

  // Pannello frontale in similpelle (parte bassa del frontale)
  add(box(BODY_W - 0.36, BODY_H - 0.5, 0.05, 0.12, 0.02, 3), M.leather, 0.05, BODY_Y - 0.17, FRONT + 0.005);

  // Torretta del mirino: trapezio estruso
  (function hump() {
    const s = new THREE.Shape();
    const bw = 1.0, tw = 0.62, y0 = 0, y1 = 0.78, r = 0.1;
    s.moveTo(-bw, y0); s.lineTo(bw, y0);
    s.lineTo(tw + r * 0.6, y1 - r); s.quadraticCurveTo(tw, y1, tw - r, y1);
    s.lineTo(-tw + r, y1); s.quadraticCurveTo(-tw, y1, -tw - r * 0.6, y1 - r);
    s.lineTo(-bw, y0);
    const g = slab(s, 1.08, 0.1, 5);
    add(g, M.body, 0.45, TOP - 0.12, -0.03);
  })();
  const HUMP_TOP = TOP - 0.12 + 0.78 + 0.1;

  // Impugnatura: profilo in pianta estruso in verticale, molto smussato
  (function grip() {
    const s = new THREE.Shape();             // coordinate (x, -z)
    s.moveTo(-1.83, -0.2);
    s.lineTo(-1.83, -0.95);
    s.bezierCurveTo(-1.83, -1.38, -1.55, -1.42, -1.3, -1.42);
    s.bezierCurveTo(-0.98, -1.42, -0.86, -1.22, -0.84, -0.95);
    s.bezierCurveTo(-0.82, -0.7, -0.86, -0.5, -0.86, -0.2);
    s.lineTo(-1.83, -0.2);
    const H = TOP - 0.25 - BOTTOM, bev = 0.17;
    const g = new THREE.ExtrudeGeometry(s, { depth: H - 2 * bev, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: 6, curveSegments: 28 });
    g.rotateX(-Math.PI / 2);
    g.translate(0, BOTTOM + bev, 0);
    g.computeVertexNormals();
    add(g, M.leather);
    // calotta superiore liscia dell'impugnatura
    const cap = new THREE.ExtrudeGeometry(s, { depth: 0.12, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.17, bevelSegments: 4, curveSegments: 28 });
    cap.rotateX(-Math.PI / 2); cap.translate(0, TOP - 0.25, 0); cap.computeVertexNormals();
    add(cap, M.body);
  })();
  const GRIP_TOP = TOP - 0.07;

  // Slitta flash
  (function shoe() {
    const y = HUMP_TOP;
    add(box(1.0, 0.06, 0.78, 0.04, 0.015, 2), M.metal, 0.45, y + 0.02, -0.03);
    add(box(0.12, 0.08, 0.78, 0.02, 0.01, 2), M.metal, 0.45 - 0.4, y + 0.08, -0.03);
    add(box(0.12, 0.08, 0.78, 0.02, 0.01, 2), M.metal, 0.45 + 0.4, y + 0.08, -0.03);
    add(box(0.62, 0.03, 0.55, 0.03, 0.01, 2), M.black, 0.45, y + 0.06, -0.05);
    for (let i = -2; i <= 2; i++) add(new THREE.CylinderGeometry(0.025, 0.025, 0.02, 12), M.metal, 0.45 + i * 0.1, y + 0.08, -0.05);
  })();

  // Ghiera dei modi (con incisioni sul tappo)
  (function modeDial() {
    const x = -1.08, z = -0.12, r = 0.37, h = 0.26, y = TOP + h / 2 - 0.02;
    add(new THREE.CylinderGeometry(r * 0.9, r * 0.9, 0.06, 48), M.body, x, TOP + 0.01, z);
    add(new THREE.CylinderGeometry(r, r, h, 96, 1, true), M.dial, x, y, z);
    // tappo con scritte radiali
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#1a1a1b'; g.fillRect(0, 0, 512, 512);
    g.fillStyle = '#e6e6e6'; g.textAlign = 'center'; g.textBaseline = 'middle';
    const marks = ['AUTO', 'P', 'S', 'A', 'M', 'C1', 'C2', 'SCN', '◐', '▭'];
    marks.forEach((t, i) => {
      const a = -Math.PI / 2 + i * (Math.PI * 2 / marks.length);
      g.save(); g.translate(256 + Math.cos(a) * 196, 256 + Math.sin(a) * 196); g.rotate(a + Math.PI / 2);
      g.font = `500 ${t.length > 2 ? 34 : 44}px "Google Sans Flex", Arial, sans-serif`;
      g.fillText(t, 0, 0); g.restore();
    });
    g.strokeStyle = '#2c2c2e'; g.lineWidth = 3; g.beginPath(); g.arc(256, 256, 140, 0, Math.PI * 2); g.stroke();
    const capTex = new THREE.CanvasTexture(c); capTex.anisotropy = maxAniso; capTex.encoding = THREE.sRGBEncoding;
    const capMat = new THREE.MeshStandardMaterial({ map: capTex, roughness: 0.5, metalness: 0.1 });
    add(new THREE.CylinderGeometry(r - 0.005, r - 0.005, 0.012, 96), [M.dial, capMat, M.dial], x, y + h / 2, z);
    // indice fisso
    add(box(0.05, 0.03, 0.1, 0.01, 0.005, 1), M.white, x, TOP + 0.005, z + r + 0.06);
  })();

  // Rotella principale (anteriore) e pulsante di scatto con collare
  add(new THREE.CylinderGeometry(0.27, 0.27, 0.17, 72, 1, false), M.dialS, -1.62, GRIP_TOP + 0.1, 0.3);
  (function shutter() {
    const x = -1.36, z = 1.02, y = GRIP_TOP + 0.03;
    add(new THREE.CylinderGeometry(0.27, 0.29, 0.08, 72), M.dialS, x, y, z);
    add(new THREE.CylinderGeometry(0.17, 0.17, 0.09, 64), M.metalD, x, y + 0.06, z);
    const btn = new THREE.SphereGeometry(0.165, 48, 12, 0, Math.PI * 2, 0, 0.55);
    add(btn, M.button, x, y + 0.02, z);
  })();
  // Leva di accensione e pulsanti superiori
  add(box(0.22, 0.12, 0.22, 0.05, 0.03, 2), M.button, -1.58, GRIP_TOP + 0.06, -0.38);
  add(box(0.5, 0.07, 0.2, 0.05, 0.02, 2), M.button, 1.55, TOP + 0.03, -0.1);
  add(box(0.12, 0.1, 0.14, 0.03, 0.02, 2), M.button, 1.75, TOP + 0.07, -0.1);
  // fori microfono
  for (let i = 0; i < 3; i++) add(new THREE.CylinderGeometry(0.018, 0.018, 0.02, 10), M.black, 1.0 + i * 0.07, HUMP_TOP - 0.01, 0.25);
  for (let i = 0; i < 3; i++) add(new THREE.CylinderGeometry(0.018, 0.018, 0.02, 10), M.black, -0.1 + i * 0.07, HUMP_TOP - 0.01, 0.25);

  // Frontale: luce AF, sblocco obiettivo, rotella anteriore
  add(cylZ(0.085, 0.04, 32), M.lamp, -0.55, TOP - 0.28, FRONT + 0.01);
  add(cylZ(0.1, 0.03, 32), M.black, -0.55, TOP - 0.28, FRONT - 0.005);
  add(cylZ(0.15, 0.08, 48), M.button, 1.74, BODY_Y - 0.3, FRONT + 0.02);
  add(cylZ(0.1, 0.1, 48), M.button, 1.74, BODY_Y - 0.3, FRONT + 0.05);

  // Attacchi tracolla
  [-1, 1].forEach(sx => {
    add(box(0.12, 0.34, 0.3, 0.05, 0.03, 2), M.body, sx * (BODY_W / 2 + 0.03), TOP - 0.3, -0.05);
    const ring = add(new THREE.TorusGeometry(0.11, 0.022, 12, 32), M.metal, sx * (BODY_W / 2 + 0.11), TOP - 0.24, -0.05);
    ring.rotation.set(0, Math.PI / 2, 0.5 * sx);
  });

  // Fianco destro: sportelli porte con incisioni
  (function ports() {
    const x = BODY_W / 2 + 0.005;
    add(box(0.04, 0.95, 0.42, 0.06, 0.015, 2), M.leather, x, BODY_Y - 0.25, 0.2).rotation.set(0, 0, 0);
    add(box(0.04, 0.5, 0.42, 0.06, 0.015, 2), M.leather, x, BODY_Y - 0.25, -0.28);
    label('MIC', 0.3, 0.1, model, [x + 0.03, BODY_Y - 0.6, 0.2], Math.PI / 2, 60);
    label('HDMI', 0.34, 0.1, model, [x + 0.03, BODY_Y - 0.1, -0.28], Math.PI / 2, 60);
  })();

  // Retro: display orientabile, mirino, comandi
  (function back() {
    // cerniera display
    add(box(0.16, 1.36, 0.12, 0.05, 0.03, 2), M.body, 1.66, BODY_Y - 0.12, BACK - 0.06);
    // display
    add(box(2.5, 1.5, 0.12, 0.1, 0.04, 3), M.body, 0.3, BODY_Y - 0.12, BACK - 0.07);
    add(box(2.3, 1.32, 0.02, 0.05, 0.008, 2), M.black, 0.3, BODY_Y - 0.12, BACK - 0.135);
    add(box(2.12, 1.18, 0.02, 0.03, 0.006, 2), M.screen, 0.3, BODY_Y - 0.12, BACK - 0.145);
    // oculare in gomma
    const eyeZ = BACK - 0.2;
    add(box(1.2, 0.86, 0.36, 0.26, 0.1, 5), M.leather, 0.45, TOP + 0.28, eyeZ);
    add(box(0.82, 0.48, 0.05, 0.1, 0.02, 3), M.black, 0.45, TOP + 0.28, eyeZ - 0.17);
    add(box(0.6, 0.32, 0.03, 0.08, 0.01, 2), M.glass, 0.45, TOP + 0.28, eyeZ - 0.175);
    add(cylZ(0.05, 0.02, 24), M.black, 0.9, TOP + 0.28, eyeZ - 0.18);
    // pulsanti sul retro
    const bz = BACK - 0.02;
    const btn = (x, y, r = 0.1) => { add(cylZ(r, 0.08, 40), M.button, x, y, bz); };
    btn(1.6, TOP - 0.2, 0.11); label('MENU', 0.34, 0.08, model, [1.25, TOP - 0.2, BACK - 0.005], Math.PI, 50);
    // joystick
    add(cylZ(0.13, 0.06, 40), M.body, -0.75, TOP - 0.3, bz);
    add(cylZ(0.1, 0.16, 40), M.dialS, -0.75, TOP - 0.3, bz - 0.06);
    btn(-1.25, TOP - 0.22, 0.12); label('AF ON', 0.3, 0.08, model, [-1.25, TOP - 0.42, BACK - 0.005], Math.PI, 46);
    btn(-1.7, TOP - 0.18); btn(-1.7, TOP - 0.55);
    btn(-1.3, BODY_Y + 0.15); label('INFO', 0.3, 0.08, model, [-1.3, BODY_Y - 0.03, BACK - 0.005], Math.PI, 50);
    // ghiera posteriore + croce direzionale
    add(cylZ(0.36, 0.08, 72), M.dialS, -1.42, BODY_Y - 0.5, bz);
    add(cylZ(0.27, 0.1, 64), M.button, -1.42, BODY_Y - 0.5, bz - 0.01);
    add(cylZ(0.12, 0.12, 48), M.body, -1.42, BODY_Y - 0.5, bz - 0.02);
    label('SET', 0.2, 0.08, model, [-1.42, BODY_Y - 0.5, bz - 0.085], Math.PI, 50);
    btn(-1.8, BOTTOM + 0.2, 0.1);
  })();

  // Fondo: attacco treppiede
  add(new THREE.CylinderGeometry(0.16, 0.16, 0.02, 32), M.metalD, 0.45, BOTTOM - 0.005, 0);

  // ----------------------- Obiettivo -----------------------
  const lens = new THREE.Group();
  lens.position.set(0.45, 0.02, FRONT);
  model.add(lens);
  const addL = (geo, mat, z = 0) => add(geo, mat, 0, 0, z, lens);

  // Baionetta metallica e anello di innesto
  addL(lathe([[0.95, 0.0], [1.14, 0.0], [1.16, 0.02], [1.16, 0.09], [1.12, 0.11], [1.05, 0.11]]), M.metal);
  // Puntino di allineamento bianco
  add(new THREE.SphereGeometry(0.03, 16, 16), M.white, 0, 1.13, 0.13, lens);
  // Fusto (profilo a tornio): base, fascia indici, frontale con labbro interno
  addL(lathe([
    [1.04, 0.10], [1.07, 0.13], [1.07, 0.42], [1.04, 0.46],
    [1.0, 0.46], [1.0, 1.36],                // sotto la ghiera zoom
    [1.02, 1.37], [1.03, 1.40], [1.03, 1.60], [1.0, 1.62],
    [0.98, 1.62], [0.98, 1.92],              // sotto la ghiera fuoco
    [1.02, 1.93], [1.04, 1.96], [1.04, 2.10], [1.02, 2.14], [0.97, 2.16],
    [0.93, 2.14], [0.92, 2.10], [0.90, 2.07]
  ]), M.lens);
  // Ghiera zoom in gomma zigrinata (con bordi arrotondati)
  addL(cylZ(1.075, 0.86, 128, true), M.knurl, 0.91);
  addL(lathe([[1.0, 0.46], [1.05, 0.47], [1.075, 0.49]]), M.knurl);
  addL(lathe([[1.075, 1.33], [1.05, 1.35], [1.0, 1.36]]), M.knurl);
  // Ghiera di messa a fuoco a righe sottili
  addL(cylZ(1.0, 0.28, 128, true), M.focus, 1.77);
  // Scala focale incisa sulla fascia
  (function focalScale() {
    const c = document.createElement('canvas'); c.width = 2048; c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.textAlign = 'center';
    g.font = '500 36px "Google Sans Flex", Arial, sans-serif';
    const vals = ['18', '24', '35', '50', '70', '100', '150'];
    vals.forEach((v, i) => g.fillText(v, 1024 + (i - 3) * 72, 34));
    const t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso; t.encoding = THREE.sRGBEncoding;
    const m = addL(cylZ(1.034, 0.12, 128, true), labelMat(t, 0.9), 1.5);
    m.castShadow = false;
  })();
  // Fascia indice zoom
  add(box(0.03, 0.03, 0.08, 0.01, 0.005, 1), M.white, 0, 1.035, 1.44, lens);
  // Scritta generica sul frontale: diametro filtro
  (function frontRing() {
    const c = document.createElement('canvas'); c.width = 2048; c.height = 64;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '500 30px "Google Sans Flex", Arial, sans-serif';
    g.fillText('18–150 mm  1:3.5–6.3   ·   Ø 55 mm', 1024, 34);
    const t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso; t.encoding = THREE.sRGBEncoding;
    const m = addL(cylZ(1.044, 0.1, 128, true), labelMat(t, 0.75), 2.03);
    m.castShadow = false; m.rotation.z = Math.PI * 0.12;
  })();
  // Interno: tubo nero, lenti con trattamento antiriflesso
  addL(cylZ(0.9, 1.0, 64, true), M.black, 1.58);
  addL(cylZ(0.88, 0.02, 64), M.black, 1.1);
  const cap = (R, rr, zApex, mat) => {
    const t = Math.asin(Math.min(0.999, rr / R));
    const g = new THREE.SphereGeometry(R, 72, 18, 0, Math.PI * 2, 0, t);
    g.rotateX(Math.PI / 2);
    const m = add(g, mat, 0, 0, zApex - R, lens); m.castShadow = false; return m;
  };
  cap(2.4, 0.5, 1.28, M.coatB);       // elemento posteriore
  cap(1.6, 0.68, 1.62, M.coatA);      // elemento intermedio
  addL(new THREE.TorusGeometry(0.7, 0.03, 12, 64), M.black, 1.6);
  cap(2.0, 0.9, 2.05, M.glass);       // lente frontale
  // anello interno con incisioni (cornice della lente)
  addL(new THREE.TorusGeometry(0.905, 0.025, 12, 96), M.lens, 2.07);

  // Centro di rotazione: tra corpo e obiettivo
  model.position.set(-0.1, 0, -0.95);

  const pivot = new THREE.Group();
  pivot.add(model);
  scene.add(pivot);

  // ---------- Piano d'appoggio: ombra reale + ombra di contatto ----------
  const groundY = BOTTOM - 0.012;
  const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.22 }));
  shadowPlane.rotation.x = -Math.PI / 2; shadowPlane.position.y = groundY; shadowPlane.receiveShadow = true;
  scene.add(shadowPlane);
  (function contact() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(0.45, 'rgba(0,0,0,0.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(5.4, 5.4),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, opacity: 0.75 }));
    m.rotation.x = -Math.PI / 2; m.position.y = groundY + 0.002;
    scene.add(m);
    scene.userData.contact = m;
  })();

  // =====================================================================
  // Palette
  // =====================================================================
  function setPalette(name) {
    const p = PALETTES[name]; if (!p) return;
    M.body.color.setHex(p.body); M.leather.color.setHex(p.leather);
    M.lens.color.setHex(p.lens);
    [M.knurl, M.focus].forEach(m => m.color.setHex(p.trim));
    [M.dial, M.dialS, M.button].forEach(m => m.color.setHex(p.trim + 0x080808));
    host.querySelectorAll('.swatches button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === name));
  }
  host.querySelectorAll('.swatches button').forEach(b => b.addEventListener('click', () => setPalette(b.dataset.p)));

  // =====================================================================
  // Interazione: trascina = rotazione (orizzontale) e altezza di vista (verticale)
  // =====================================================================
  let yaw = 0.62, tYaw = yaw, elev = 0.32, tElev = elev;
  let dragging = false, lastX = 0, lastY = 0, idle = 0, vel = 0;
  const el = renderer.domElement;
  const ELEV_MIN = 0.06, ELEV_MAX = 1.0;

  el.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; el.setPointerCapture(e.pointerId); hint.style.opacity = 0; });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
    vel = dx * 0.01; tYaw += vel;
    tElev = Math.max(ELEV_MIN, Math.min(ELEV_MAX, tElev + dy * 0.005));
    idle = 0;
  });
  const end = () => { dragging = false; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') tYaw -= 0.3;
    if (e.key === 'ArrowRight') tYaw += 0.3;
    if (e.key === 'ArrowUp') tElev = Math.min(ELEV_MAX, tElev + 0.12);
    if (e.key === 'ArrowDown') tElev = Math.max(ELEV_MIN, tElev - 0.12);
    idle = 0;
  });

  // =====================================================================
  // Resize + loop
  // =====================================================================
  const DIST = 15;
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    cam.aspect = w / h; cam.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  let visible = true, t0 = performance.now(), running = false;
  new IntersectionObserver(([en]) => { visible = en.isIntersecting; if (visible && !running) { t0 = performance.now(); requestAnimationFrame(loop); } }).observe(stage);

  function loop(now) {
    if (!visible) { running = false; return; }
    running = true;
    const dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
    idle += dt;
    if (!dragging) {
      tYaw += vel; vel *= 0.92;
      if (!reduceMotion && idle > 2.5) tYaw += dt * 0.28;
    }
    yaw += (tYaw - yaw) * 0.12;
    elev += (tElev - elev) * 0.12;
    pivot.rotation.y = yaw;
    // fluttuazione morbida sopra il piano, con ombra che si allarga e sfuma
    const lift = 0.22, bob = reduceMotion ? 0 : Math.sin(now / 1100) * 0.09;
    pivot.position.y = lift + bob;
    const c = scene.userData.contact, k = (bob + 0.09) / 0.18;
    c.scale.setScalar(1 + k * 0.12); c.material.opacity = 0.75 - k * 0.25;
    cam.position.set(0, target.y + Math.sin(elev) * DIST, Math.cos(elev) * DIST);
    cam.lookAt(target);
    renderer.render(scene, cam);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
